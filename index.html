<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kairos | Video Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #f0f1f3;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .wrap {
    background: #fff; width: 100%; max-width: 400px;
    border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.08);
    padding: 34px 30px 28px; text-align: center;
  }
  h1 { font-size: 26px; color: #1a1a1a; letter-spacing: 1px; }

  /* 名片本体 */
  .biz {
    position: relative;
    margin: 24px 0 26px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0,0,0,.12);
    padding: 26px 24px 30px;
    overflow: hidden;
    text-align: left;
  }
  /* 红色斜角装饰 */
  .biz::before {
    content: ""; position: absolute; right: -40px; bottom: -60px;
    width: 200px; height: 140px;
    background: #c0392b;
    transform: skewY(-18deg);
    opacity: .92;
  }
  .biz::after {
    content: ""; position: absolute; right: -70px; bottom: 30px;
    width: 180px; height: 26px;
    background: #e8e8e8;
    transform: skewY(-18deg);
  }
  .name { font-size: 24px; font-weight: 700; color: #c0392b; position: relative; z-index: 2; }
  .role { font-size: 15px; color: #555; margin-top: 4px; position: relative; z-index: 2; }
  .details { margin-top: 22px; position: relative; z-index: 2; }
  .line {
    display: flex; align-items: center; gap: 9px;
    font-size: 13.5px; color: #333; margin-bottom: 9px;
  }
  .line a { color: #333; text-decoration: none; word-break: break-all; }
  .ico {
    width: 17px; height: 17px; flex-shrink: 0;
    background: #c0392b; border-radius: 3px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 10px; font-weight: 700;
  }

  .btn {
    display: inline-block; background: #6c6ce0; color: #fff;
    padding: 11px 26px; border-radius: 6px;
    text-decoration: none; font-size: 14px; font-weight: 600;
  }
  footer { margin-top: 14px; font-size: 12px; color: #999; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>KAIROS</h1>

    <div class="biz">
      <div class="name">Kairos</div>
      <div class="role">Video Editor</div>
      <div class="details">
        <div class="line"><span class="ico">☎</span><a href="tel:+8618516550743">+86 185 1655 0743</a></div>
        <div class="line"><span class="ico">@</span><a href="mailto:byebyesheep1@gmail.com">byebyesheep1@gmail.com</a></div>
      </div>
    </div>

    <a class="btn" href="vcard.vcf" download>Download Business Card</a>
    <footer>Keep Contact!</footer>
  </div>
</body>
</html>
